services:
  postgres:
    image: postgres:16
    container_name: ruang_postgres
    environment:
      POSTGRES_USER: ruang
      POSTGRES_PASSWORD: ruang
      POSTGRES_DB: ruang_dev
    ports:
      - "5433:5432"
    volumes:
      - ruang_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruang -d ruang_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ruang_postgres_data:
    driver: local
